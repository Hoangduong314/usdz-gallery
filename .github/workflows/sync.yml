name: sync-channel
on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
  push:
    paths: [sync.py]
concurrency:
  group: sync
  cancel-in-progress: false
jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Crawl channel preview
        run: python sync.py
      - name: Commit data
        run: |
          git config user.name "gallery-bot"
          git config user.email "gallery-bot@users.noreply.github.com"
          git add gallery.json
          git diff --cached --quiet || git commit -m "channel sync $(date -u '+%F %T') UTC"
          git push
