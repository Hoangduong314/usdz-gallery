name: sync-channel
# crawler 37 kênh tele -> gallery.json -> Pages (daily 01:00 UTC; deep backfill: PAGES=60/run, CAP=500/ch)
on:
  schedule:
    - cron: "0 1 * * *"
  workflow_dispatch:
  push:
    paths: [sync.py]
concurrency:
  group: sync
  cancel-in-progress: false
jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Crawl channel preview
        env:
          PAGES: "60"   # pages walked per channel per run (20 msgs each) = ~1200 msgs backfilled daily
          CAP: "500"    # keep newest N entries per external channel
        run: python sync.py
      - name: Commit data
        run: |
          git config user.name "gallery-bot"
          git config user.email "gallery-bot@users.noreply.github.com"
          git add gallery.json
          git diff --cached --quiet || git commit -m "channel sync $(date -u '+%F %T') UTC"
          git push
